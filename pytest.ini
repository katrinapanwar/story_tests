# pytest.ini - settings for the story tests
#
# pytest reads this file automatically when run from the story_tests folder.

[pytest]
# folder where pytest-bdd looks for the .feature files
bdd_features_base_dir = features

# tags used in the feature files (@story1, @normal, ...), registered so pytest does not warn about them
# story1-story5 name the story, normal/alternate/error name the flow
markers =
    story1: create a todo
    story2: update a todo
    story3: delete a todo
    story4: filter todos
    story5: link a todo to a project
    normal: normal flow
    alternate: alternate flow
    error: error flow
